<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CNC Cabinet Designer Pro v11 — cabinet design, cut lists, nesting optimization, drilling, hardware and DXF export" />
    <meta name="theme-color" content="#070b12" />
    <meta name="color-scheme" content="dark" />
<title>CNC Cabinet Designer Pro v11</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cabinets" />
    <meta name="application-name" content="CNC Cabinet Designer Pro" />
    <!-- Offline build: no external fonts or assets — fully self-contained -->
    <script>
      /* When this page is opened straight from disk (file://), the dev entry
         script (/src/main.tsx) cannot load. Show a friendly offline launcher
         instead of a blank page. In the production single-file build (dist/),
         React mounts normally, so this never triggers there. */
      (function () {
        if (location.protocol !== "file:") return;
        window.addEventListener("DOMContentLoaded", function () {
          setTimeout(function () {
            var root = document.getElementById("root");
            if (!root || root.innerHTML.trim() !== "") return; // app already mounted
            var style = document.createElement("style");
            style.textContent =
              "body{margin:0;background:#070b12;color:#dbe2ec;font-family:'Segoe UI',Arial,sans-serif}" +
              ".wrap{max-width:560px;margin:14vh auto 0;padding:0 24px;text-align:center}" +
              "h1{font-size:22px;margin:0 0 10px}.badge{display:inline-block;background:#f5b33c;color:#070b12;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.08em;margin-bottom:16px}" +
              "p{color:#7d8ea6;line-height:1.65;font-size:14px}" +
              ".btn{display:inline-block;margin:14px 0;background:#f5b33c;color:#070b12;font-weight:700;padding:13px 24px;border-radius:10px;text-decoration:none;font-size:15px}" +
              ".btn:hover{background:#ffc55e}" +
              "code{background:#111b29;padding:2px 7px;border-radius:6px;color:#f5b33c;font-size:13px}" +
              ".alt{font-size:12px;color:#51637d}";
            root.innerHTML =
              '<div class="wrap">' +
              '<span class="badge">100% OFFLINE</span>' +
              "<h1>CNC Cabinet Designer Pro</h1>" +
              "<p>You opened the <b>source</b> file, which only runs through the dev server.<br/>" +
              "The real offline app is one double-click away:</p>" +
              '<a class="btn" href="./dist/index.html">Launch Offline App →</a>' +
              "<p class=\"alt\">If that page is missing, run <code>npm install</code> then <code>npm run build</code> once,<br/>" +
              "or simply double-click <code>start-offline.bat</code> — it builds and launches automatically.</p>" +
              "</div>";
          }, 400);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
